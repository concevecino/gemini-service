# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=gemini-microservice
spring.datasource.platform = mysql
spring.datasource.url = jdbc:mysql://localhost:3306/demo?useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.name = demo
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.initialization-mode=always

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Spring AI para Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY:tu-api-key-aqui}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash